name: CI

# Run on every push to main and on every pull request (to any branch).
on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded runs of the same ref so old branches don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Prettier: fail if the working tree is not formatted.
  format:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
      - run: pnpm format:check

  # ESLint: fail on any lint error.
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
      - run: pnpm lint

  # TypeScript: fail on any type error (generates Next.js route types first).
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
      - run: pnpm typecheck

  # Next.js: fail if the production build does not succeed.
  build:
    name: Next.js build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup
      - run: pnpm build
